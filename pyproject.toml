[project]
name = "sesiunea-de-comunicari-stiintifice-studentesti-mai-2026"
version = "0.1.0"
description = "Algoritmi genetici - utilizari si aplicații"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [
    { name = "Marius-Florinel Ionel", email = "marius.ionel@s.utm.ro" },
    { name = "Cristina Mirela Done", email = "cristina.done@s.utm.ro" },
    { name = "Brandon Aron", email = "brandon.aron@s.utm.ro" },
]
dependencies = [
    "geneticalgorithm>=1.0.2",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.5.7",
    "jupyterlab-quarto>=0.3.5",
    "matplotlib>=3.10.9",
    "pandas>=3.0.3",
    "prettytable>=3.17.0",
    "py5>=0.10.10a7",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "tqdm>=4.67.3",
]

[dependency-groups]
dev = [
    "install-jdk>=1.1.0",
    "quarto-cli>=1.9.37",
]
